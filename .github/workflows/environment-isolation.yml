name: VSN Environment Isolation

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  environment-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
      - name: Check Shopify environment templates and isolation
        run: node scripts/environment-contract.mjs --environment=repository
      - name: Execute fail-closed environment regression tests
        run: node --test tests/environment-contract.test.mjs
      - name: Verify SQLite and PostgreSQL data model parity
        run: node scripts/verify-prisma-environment-parity.mjs
