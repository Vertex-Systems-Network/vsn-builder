name: T032 Shopify Theme Block Schema and Assets (No Deploy)
on:
  pull_request:
    paths:
      - "extensions/vsn-page-builder-theme/**"
      - "config/theme-matrix.json"
      - "scripts/t032-theme-extension-static-audit.mjs"
      - "tests/t032-theme-extension-static-audit.test.mjs"
      - "tests/fixtures/theme-compat/**"
      - "scripts/t032-pinned-theme-fixtures.mjs"
      - "tests/t032-pinned-theme-fixtures.test.mjs"
      - "tests/t032-shopify-native-newsletter.test.mjs"
      - "scripts/t032-newsletter-form-contract.mjs"
      - ".github/workflows/t032-shopify-theme-extension-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-extension-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout immutable source (no credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pinned Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.18.0"
      - name: Validate packaged Shopify theme blocks and assets
        run: node scripts/t032-theme-extension-static-audit.mjs
      - name: Test actual extension and failing adversarial fixtures
        run: node --test tests/t032-theme-extension-static-audit.test.mjs
      - name: Inspect pinned Dawn 16 and Horizon app-placement sections
        run: node scripts/t032-pinned-theme-fixtures.mjs
      - name: Reject incorrect theme placement and unsupported fixture claims
        run: node --test tests/t032-pinned-theme-fixtures.test.mjs
      - name: Verify native Shopify customer newsletter markup and feedback
        run: node scripts/t032-newsletter-form-contract.mjs
      - name: Adversarial test newsletter consent, escaping and multiple blocks
        run: node --test tests/t032-shopify-native-newsletter.test.mjs
