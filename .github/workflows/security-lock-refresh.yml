name: Security Lockfile Refresh (one-time)

on:
  push:
    branches:
      - security/ai-network-hardening-2026-09-15

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.repository == 'Vertex-Systems-Network/vsn-builder' && github.ref == 'refs/heads/security/ai-network-hardening-2026-09-15'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: security/ai-network-hardening-2026-09-15
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.18.0
          cache: npm
      - name: Apply security overrides without running package scripts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.overrides = {
            ...(pkg.overrides || {}),
            'brace-expansion': '2.1.4',
            'nanoid': '3.3.18',
            'qs': '6.16.0',
            'morgan': '1.12.0',
            'deepmerge-ts': '8.0.0'
          };
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          npm install --package-lock-only --ignore-scripts
          npm audit --omit=dev --audit-level=high
      - name: Commit refreshed manifest and lockfile, then remove this one-time workflow
        run: |
          rm .github/workflows/security-lock-refresh.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json .github/workflows/security-lock-refresh.yml
          git diff --cached --check
          git commit -m 'security: refresh vulnerable production dependencies'
          git push origin HEAD:security/ai-network-hardening-2026-09-15
