name: Prisma Raw Query Cleanup
on:
  push:
    branches:
      - security/prisma-raw-query-cleanup-20260917
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./ci.sqlite
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.18.0
          cache: npm
      - name: Replace static unsafe raw queries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/routes/app.control-center.jsx')
          text = path.read_text()
          old1 = 'await db.$queryRawUnsafe("SELECT 1")'
          new1 = 'await db.$queryRaw`SELECT 1`'
          old2 = 'await db.$queryRawUnsafe(\'SELECT migration_name, finished_at FROM "_prisma_migrations" WHERE finished_at IS NOT NULL ORDER BY finished_at DESC\')'
          new2 = 'await db.$queryRaw`SELECT migration_name, finished_at FROM "_prisma_migrations" WHERE finished_at IS NOT NULL ORDER BY finished_at DESC`'
          if text.count(old1) != 1 or text.count(old2) != 1:
              raise SystemExit('Expected static $queryRawUnsafe literals not found exactly once each; refusing broad edit.')
          text = text.replace(old1, new1, 1).replace(old2, new2, 1)
          if '$queryRawUnsafe' in text:
              raise SystemExit('Unexpected $queryRawUnsafe remains in control-center route.')
          path.write_text(text)
          PY
      - run: npm ci
      - run: npm run security:audit
      - run: npm run typecheck
      - run: npm run build
      - run: npm run prisma -- generate
      - run: npm run prisma -- migrate deploy
      - run: npm run qa:release
      - name: Commit validated cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/routes/app.control-center.jsx
          test "$(git diff --cached --name-only)" = "app/routes/app.control-center.jsx"
          git commit -m 'security: replace static unsafe prisma raw queries'
          git push origin HEAD:security/prisma-raw-query-cleanup-20260917
