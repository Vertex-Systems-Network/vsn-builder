name: VSN One-Time Dependency Lock Repair

on:
  push:
    branches:
      - feat/three-environment-foundation-20261012

permissions:
  contents: write

concurrency:
  group: vsn-builder-lock-repair-once
  cancel-in-progress: false

jobs:
  patch-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify exact source branch
        shell: bash
        env:
          EXPECTED_REF: refs/heads/feat/three-environment-foundation-20261012
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "$EXPECTED_REF"
          test "$GITHUB_REPOSITORY" = "Vertex-Systems-Network/vsn-builder"
      - name: Checkout branch with bot write capability
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: feat/three-environment-foundation-20261012
      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          cache: npm
      - name: Apply npm compatible transitive security repairs to lock only
        shell: bash
        run: |
          # npm audit fix returns non-zero if other advisories remain; the
          # production audit below is the mandatory compatibility gate.
          npm audit fix --package-lock-only --ignore-scripts --no-fund || echo "Compatible updates applied; remaining advisories require separate review."
      - name: Target known vulnerable transitive packages within compatible ranges
        shell: bash
        run: |
          npm update brace-expansion morgan --package-lock-only --ignore-scripts --no-fund || echo "Targeted npm update incomplete; required production audit still enforces no high vulnerabilities."
      - name: Verify reproducible npm install
        run: npm ci
        env:
          DATABASE_URL: file:./ci.sqlite
      - name: Enforce production audit high threshold
        run: npm audit --omit=dev --audit-level=high
      - name: Report all remaining development vulnerabilities without suppressing them
        shell: bash
        run: |
          npm audit --include=dev --audit-level=high > full-audit-report.txt 2>&1 || echo "Full dependency audit still has blockers; see issue 96."
          sed -n '1,50p' full-audit-report.txt
      - name: Verify isolated environment contracts
        run: npm run env:check && npm run env:test
      - name: Review and commit only lockfile
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- package.json
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          git commit -m "fix(security): refresh compatible audited npm lockfile"
          git push origin HEAD:refs/heads/feat/three-environment-foundation-20261012
