name: VSN Non-Release Quality Diagnostics

# Runs downstream application checks while the mandatory full dependency
# security audit remains blocked. This cannot certify or deploy any environment.
on:
  push:
    branches:
      - feat/builder-nonrelease-qa-diagnostics-20261013
      - integration/builder-cloud-qa-20261013
      - feat/builder-environment-branding-20261013
      - feat/builder-hosted-preflight-20261013
      - feat/builder-cloud-baseline-migration-20261013
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vsn-nonrelease-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application-diagnostics:
    name: Application diagnostics (NOT release acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: file:./ci.sqlite
      NODE_ENV: test
    steps:
      - name: Check out exact source without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          cache: npm
      - name: Reproducible install
        run: npm ci
      - name: Environment isolation and diagnostics workflow regression checks
        run: npm run env:check && npm run env:test && node --test tests/nonrelease-qa-diagnostics.test.mjs
      - name: Validate brand names and environment badges
        run: node --test tests/environment-branding.test.mjs
      - name: Test hosted environment inventory without real credentials
        run: node --test tests/hosted-environment-inventory.test.mjs
      - name: Verify local/cloud schema and offline migration contract
        run: node scripts/verify-prisma-environment-parity.mjs && node scripts/validate-cloud-baseline.mjs && node --test tests/cloud-baseline-integrity.test.mjs
      - name: Source security audit
        run: npm run security:audit
      - name: Legacy webhook egress security audit
        run: node scripts/legacy-webhook-egress-audit.mjs
      - name: Prepare isolated SQLite CI database
        run: |
          npm run prisma -- generate
          npm run prisma -- migrate deploy
      - name: Typecheck
        run: npm run typecheck
      - name: Production build in test environment
        run: npm run build
      - name: Release QA diagnostics (no publishing)
        id: qa
        shell: bash
        run: |
          set -o pipefail
          npm run qa:release 2>&1 | tee qa-release-diagnostics.log
      - name: Upload QA diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: builder-qa-diagnostics
          path: qa-release-diagnostics.log
          if-no-files-found: warn
          retention-days: 7
      - name: Large-page performance diagnostics
        run: npm run performance:large-pages
