name: VSN Cloudflare Workerd Local SDK Compatibility (No Deploy)
on:
  push:
    branches: [feat/builder-local-workerd-sdk-compat-20261013, fix/builder-workerd-runtime-probe-20261013, feat/builder-workerd-neon-client-lifecycle-20261013]
  pull_request:
    branches: [feat/builder-workerd-neon-client-lifecycle-20261013, test/builder-workerd-ssr-acceptance-20261013, security/builder-neon-endpoint-isolation-20261013, test/builder-workerd-real-shopify-csp-20261013, test/builder-workerd-signed-shopify-webhook-20261013]
    paths:
      - "workers/**"
      - "app/services/**"
      - "config/deployment/environments.json"
      - "tests/worker-neon-factory.test.mjs"
      - "tests/worker-real-shopify-sdk.test.mjs"
      - "tests/worker-shopify-webhook-gate.test.mjs"
      - "scripts/dev-local-workerd-smoke.mjs"
      - "scripts/environment-contract.mjs"
      - "tests/hosted-neon-url-policy.test.mjs"
      - ".github/workflows/workerd-local-compatibility.yml"
permissions:
  contents: read
concurrency:
  group: vsn-workerd-local-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-workerd:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    env:
      CI: 'true'
      NODE_ENV: test
      APP_ENV: development
    steps:
      - name: Checkout immutable code without write token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          cache: npm
      - name: Install exact app lockfile
        run: npm ci
      - name: Check production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Generate independent PostgreSQL Worker Prisma Client, offline
        env:
          DATABASE_URL: postgresql://dummy:unused@localhost:5432/unused
          DIRECT_URL: postgresql://dummy:unused@localhost:5432/unused
        run: npx prisma generate --schema prisma/cloud/schema.prisma
      - name: Verify Edge/Node Prisma Client isolation and actual generated models
        run: node scripts/verify-prisma-worker-client.mjs --generated
      - name: Recheck Shopify SDK and Neon factory Node compatibility
        run: |
          node --test tests/hosted-neon-url-policy.test.mjs
          node --test tests/worker-neon-factory.test.mjs
          node --test tests/worker-real-shopify-sdk.test.mjs
          node --test tests/worker-shopify-webhook-gate.test.mjs
      - name: Preserve TypeScript application compatibility with generated Edge code
        run: npm run typecheck
      - name: Install isolated Wrangler 4.149.0 runner tooling, not tracked
        run: |
          npm exec --yes --package=wrangler@4.149.0 -- wrangler --version
          git diff --exit-code -- package.json package-lock.json
      - name: Assert Workerd test has no hosted credentials or API access
        run: |
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -z "${SHOPIFY_API_SECRET:-}"
          test -z "${DATABASE_URL:-}"
          test -z "${DIRECT_URL:-}"
      - name: Compile SDK and test real local Cloudflare Workerd over HTTP
        run: node scripts/dev-local-workerd-smoke.mjs
      - name: Reject actual hosted Worker/Shopify deploy configuration
        run: |
          test ! -e workers/app.js
          test ! -e wrangler.staging.jsonc
          test ! -e wrangler.production.jsonc
