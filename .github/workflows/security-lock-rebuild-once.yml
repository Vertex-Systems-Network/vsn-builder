name: One-Time Builder Security Lock Regeneration (No Deploy)
on:
  push:
    branches: [fix/builder-security-overrides-20261012]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: builder-security-lock-regeneration
  cancel-in-progress: false
jobs:
  regenerate-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate isolated branch and identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Vertex-Systems-Network/vsn-builder"
          test "$GITHUB_REF" = "refs/heads/fix/builder-security-overrides-20261012"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/builder-security-overrides-20261012
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          cache: npm
      - name: Re-resolve lockfile with patched package overrides
        run: npm install --package-lock-only --ignore-scripts --no-fund --no-audit
      - name: Patch other compatible transitive vulnerabilities without forcing major upgrades
        shell: bash
        run: |
          # npm audit fix can return non-zero for unresolved dev advisories;
          # the subsequent production audit is a strict, mandatory gate.
          npm audit fix --package-lock-only --ignore-scripts --no-fund || echo "Remaining advisories were reported; no audit gate was disabled."
      - name: Check install reproducibility
        run: npm ci
        env:
          DATABASE_URL: file:./ci.sqlite
      - name: Check exact patched dependency versions
        run: node --test tests/security-overrides.test.mjs
      - name: Enforce production audit threshold
        run: npm audit --omit=dev --audit-level=high
      - name: Run isolation tests
        run: npm run env:check && npm run env:test
      - name: Record all dev-dependency advisories for later remediation
        shell: bash
        run: |
          npm audit --include=dev --audit-level=high > full-audit.txt 2>&1 || echo "Development audit remains blocked; issue 96 tracks these advisories."
          sed -n '1,65p' full-audit.txt
      - name: Commit generated lock only if production security gates pass
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- package.json
          git diff --exit-code -- tests/security-overrides.test.mjs
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          git diff --cached --name-only | grep -Fx "package-lock.json"
          git commit -m "fix(security): regenerate lockfile with patched overrides"
          git push origin HEAD:refs/heads/fix/builder-security-overrides-20261012
