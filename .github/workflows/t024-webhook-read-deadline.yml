name: T024 Shopify Webhook Bounded Body Security (No Deploy)
on:
  pull_request:
    paths:
      - "app/services/worker-shopify-webhook-gate.js"
      - "app/services/worker-shopify-uninstall-session-revoke.js"
      - "tests/worker-shopify-webhook-gate.test.mjs"
      - "tests/worker-uninstall-session-revoke.test.mjs"
      - ".github/workflows/t024-webhook-read-deadline.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  webhook-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      NODE_ENV: test
      APP_ENV: development
      DATABASE_URL: file:./t024-ci.sqlite
    steps:
      - name: Checkout tested source without write token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pinned Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.18.0"
          cache: npm
      - name: Verify no real Shopify, Neon or Cloudflare credentials are used
        run: |
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${SHOPIFY_API_SECRET:-}"
          test -z "${DIRECT_URL:-}"
      - name: Install exact project dependencies
        run: npm ci
      - name: Generate Worker-side Neon Prisma types without a real DB connection
        env:
          DATABASE_URL: postgresql://ci:unused@localhost:5432/ci?sslmode=require
          DIRECT_URL: postgresql://ci:unused@localhost:5432/ci?sslmode=require
        run: npx prisma generate --schema prisma/cloud/schema.prisma
      - name: Assert bounded webhook HMAC, total read deadline and safe uninstall fences
        run: node --test tests/worker-shopify-webhook-gate.test.mjs tests/worker-uninstall-session-revoke.test.mjs
      - name: Confirm official Shopify SDK context behavior
        run: node --test tests/worker-real-shopify-sdk.test.mjs
      - name: Refuse high-severity npm audit exceptions
        run: |
          npm audit --include=dev --audit-level=high
          npm audit --omit=dev --audit-level=high
      - name: Confirm no dependency lockfile changes
        if: always()
        run: git diff --exit-code -- package.json package-lock.json
