name: Finalize Development Audit Gate

on:
  push:
    branches:
      - security/dev-toolchain-audit-20260917

permissions:
  contents: write

jobs:
  finalize-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - name: Make development dependency audit blocking
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          old = '''      - name: Development dependency advisory report
                  continue-on-error: true
                  run: npm audit --include=dev --audit-level=high'''
          new = '''      - name: Development dependency audit
                  run: npm audit --include=dev --audit-level=high'''
          if old not in text:
              raise SystemExit('Expected diagnostic dev-audit block not found; refusing broad workflow edit.')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit permanent CI gate
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml
          if git diff --cached --quiet; then
            echo 'No CI gate change required.'
            exit 0
          fi
          git commit -m 'ci: enforce development dependency audit'
          git push origin HEAD:security/dev-toolchain-audit-20260917
