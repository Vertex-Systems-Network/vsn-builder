name: Dev Audit Lock Refresh

on:
  push:
    branches:
      - security/dev-toolchain-audit-20260917

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.18.0
          cache: npm

      - name: Refresh non-breaking dependency lock
        run: npm audit fix --package-lock-only || true

      - name: Guard package manifest
        shell: bash
        run: |
          if ! git diff --quiet -- package.json; then
            echo 'Refusing unexpected package.json modification.' >&2
            git diff -- package.json
            exit 1
          fi

      - name: Validate refreshed lock
        run: npm ci

      - name: Report remaining development advisories
        continue-on-error: true
        run: npm audit --include=dev --audit-level=high

      - name: Commit lockfile only
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'No package-lock.json changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: refresh non-breaking dependency lock'
          git push origin HEAD:security/dev-toolchain-audit-20260917
