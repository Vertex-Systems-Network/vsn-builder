name: Dev Toolchain Security Diagnostic

on:
  push:
    branches:
      - security/dev-toolchain-audit-20260917

permissions:
  contents: read

env:
  DATABASE_URL: file:./ci.sqlite
  NODE_ENV: test

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.18.0
          cache: npm

      - name: Locate codegen interpolation variables
        shell: bash
        run: |
          grep -R -n -C 4 --exclude-dir=node_modules --exclude-dir=.git --exclude=package-lock.json \
            -e 'APP_METAFIELD_NAMESPACE' -e 'VSN_THEME_MANIFEST_METAFIELD' . || true

      - name: Stage candidate secure development tree
        shell: bash
        run: |
          npm pkg set 'overrides.lodash=4.18.1'
          npm install --save-dev --package-lock-only \
            @shopify/api-codegen-preset@3.0.0 \
            @typescript-eslint/eslint-plugin@8.70.0 \
            @typescript-eslint/parser@8.70.0

      - name: Install candidate exact tree
        run: npm ci

      - name: Explain lodash resolution
        run: npm explain lodash

      - name: Development dependency audit candidate
        continue-on-error: true
        run: npm audit --include=dev --audit-level=high

      - name: Codegen diagnostic
        shell: bash
        run: |
          set -o pipefail
          npm run graphql-codegen 2>&1 | tee /tmp/graphql-codegen.log
          if grep -E '^Error: Variable "(APP_METAFIELD_NAMESPACE|VSN_THEME_MANIFEST_METAFIELD)" not found' /tmp/graphql-codegen.log; then
            echo 'Codegen interpolation normalization errors remain.' >&2
            exit 1
          fi
