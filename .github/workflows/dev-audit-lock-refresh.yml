name: Dev Toolchain Security Validation

on:
  push:
    branches:
      - security/dev-toolchain-audit-20260917

permissions:
  contents: write

env:
  DATABASE_URL: file:./ci.sqlite
  NODE_ENV: test

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.18.0
          cache: npm

      - name: Make Shopify codegen query interpolation-safe
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/services/theme-assets.server.js')
          text = path.read_text()
          old = '''  const response = await admin.graphql(`#graphql
              query VsnAssetManifest {
                currentAppInstallation {
                  metafield(namespace: "${APP_METAFIELD_NAMESPACE}", key: "${VSN_THEME_MANIFEST_METAFIELD}") { value }
                }
              }
            `);'''
          new = '''  const response = await admin.graphql(`#graphql
              query VsnAssetManifest($namespace: String!, $key: String!) {
                currentAppInstallation {
                  metafield(namespace: $namespace, key: $key) { value }
                }
              }
            `, { variables: { namespace: APP_METAFIELD_NAMESPACE, key: VSN_THEME_MANIFEST_METAFIELD } });'''
          if old not in text:
              raise SystemExit('Expected VsnAssetManifest query block not found; refusing broad edit.')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Stage secure development dependency tree
        shell: bash
        run: |
          npm pkg set 'overrides.lodash=4.18.1'
          npm install --save-dev --package-lock-only \
            @shopify/api-codegen-preset@3.0.0 \
            @typescript-eslint/eslint-plugin@8.70.0 \
            @typescript-eslint/parser@8.70.0

      - name: Install exact tree
        run: npm ci

      - name: GraphQL codegen without normalization errors
        shell: bash
        run: |
          set -o pipefail
          npm run graphql-codegen 2>&1 | tee /tmp/graphql-codegen.log
          if grep -E '^Error:' /tmp/graphql-codegen.log; then
            echo 'GraphQL codegen emitted an error despite its process exit code.' >&2
            exit 1
          fi

      - name: Guard generated/source stability
        shell: bash
        run: |
          changed="$(git diff --name-only -- . ':(exclude)package.json' ':(exclude)package-lock.json' ':(exclude)app/services/theme-assets.server.js')"
          if [ -n "$changed" ]; then
            echo 'Unexpected generated/source changes:' >&2
            printf '%s\n' "$changed" >&2
            git diff -- . ':(exclude)package.json' ':(exclude)package-lock.json' ':(exclude)app/services/theme-assets.server.js'
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Development dependency audit
        run: npm audit --include=dev --audit-level=high

      - name: Security audit
        run: npm run security:audit

      - name: Release QA
        run: npm run qa:release

      - name: Commit validated security upgrade
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json app/services/theme-assets.server.js
          if git diff --cached --quiet; then
            echo 'No validated changes to commit.'
            exit 0
          fi
          git commit -m 'security: clear development toolchain advisories'
          git push origin HEAD:security/dev-toolchain-audit-20260917
