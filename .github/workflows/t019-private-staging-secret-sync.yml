name: T019 Private Staging Worker Secret Bindings (Protected, No Deploy)
# New secret bindings are allowed only while Staging workers.dev is DISABLED.
# If Staging workers.dev is already enabled, the three existing secrets must
# ALL be present and this job is read-only. No deployment, Neon DDL, Shopify
# OAuth or Production changes. Never reveal secret values.
on:
  pull_request:
    branches: [development]
    paths:
      - "scripts/t019-private-staging-secret-sync.mjs"
      - "tests/t019-private-staging-secret-sync.test.mjs"
      - ".github/workflows/t019-private-staging-secret-sync.yml"
  push:
    branches: [development]
    paths:
      - "scripts/t019-private-staging-secret-sync.mjs"
      - "tests/t019-private-staging-secret-sync.test.mjs"
      - ".github/workflows/t019-private-staging-secret-sync.yml"
permissions:
  contents: read
concurrency:
  group: vsn-builder-private-staging-secret-sync
  cancel-in-progress: false
jobs:
  synthetic:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout untrusted PR WITHOUT credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.18.0"
      - name: Prove no-deploy atomic Staging secret sync policy with synthetic credentials
        run: node --test tests/t019-private-staging-secret-sync.test.mjs
  protected-reference:
    if: github.event_name == 'push' && github.ref == 'refs/heads/development' && github.ref_protected == true
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify protected main repo before any Worker secret context is attached
        env:
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          test "$SOURCE_REPO" = "Vertex-Systems-Network/vsn-builder"
          test "$SOURCE_REF" = "refs/heads/development"
          test "$SOURCE_PROTECTED" = "true"
  private-staging-secret-sync:
    if: github.event_name == 'push' && github.ref == 'refs/heads/development' && github.ref_protected == true
    needs: protected-reference
    environment: cloudflare-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      APP_ENV: staging
      NEON_PROJECT_ID: shiny-violet-61219572
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
      SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout exact reviewed protected source, no persisted token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.18.0"
      - name: Atomically bind only 3 encrypted private Worker Staging secrets
        run: |
          set +x
          node scripts/t019-private-staging-secret-sync.mjs
