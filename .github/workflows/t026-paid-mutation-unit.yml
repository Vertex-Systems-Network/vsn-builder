name: T026 Paid Mutation Guard Unit Tests
on:
  pull_request:
    paths:
      - "app/routes/app.pages.jsx"
      - "app/routes/app.builder.$id.jsx"
      - "app/routes/app.ai.jsx"
      - "app/routes/app.ai-command.jsx"
      - "app/routes/app.form-settings.jsx"
      - "app/routes/app.widget-studio.jsx"
      - "app/routes/app.builder-panel.$panel.jsx"
      - "app/routes/app.role-manager.jsx"
      - "app/routes/app.developer-studio.jsx"
      - "app/routes/app.email-builder.jsx"
      - "app/routes/app.floating-elements.jsx"
      - "app/routes/app.plugins.jsx"
      - "app/routes/app.campaigns.jsx"
      - "app/routes/app.stock-images.jsx"
      - "app/routes/app.stock-videos.jsx"
      - "app/routes/app.experiments.jsx"
      - "app/routes/app.backups.jsx"
      - "app/routes/app.library.jsx"
      - "app/utils/paid-mutation-guard.server.js"
      - "app/utils/paid-mutation-access.js"
      - "tests/paid-mutation-access.test.mjs"
      - ".github/workflows/t026-paid-mutation-unit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run T026 regression tests without dependency install
        run: node --test tests/paid-mutation-access.test.mjs
      - name: Enforce JavaScript syntax for isolated helper
        run: node --check app/utils/paid-mutation-access.js
