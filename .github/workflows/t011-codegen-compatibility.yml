name: T011 Shopify GraphQL Codegen Compatibility
on:
  pull_request:
    paths:
      - "package.json"
      - ".graphqlrc.js"
      - "scripts/t011-codegen-compatibility.mjs"
      - "scripts/t011-graphql-document-inventory.mjs"
      - "scripts/t011-graphql-ast-analysis.mjs"
      - ".github/workflows/t011-codegen-compatibility.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked root dependencies
        run: npm ci
      - name: Produce dependency-free GraphQL discovery evidence
        run: node scripts/t011-graphql-document-inventory.mjs
      - name: Parse real GraphQL operation templates using existing dependencies
        run: node scripts/t011-graphql-ast-analysis.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t011-source-inventory
          path: |
            t011-graphql-operation-inventory.json
            t011-graphql-ast-report.json
          if-no-files-found: warn
      - name: Require functioning Shopify GraphQL developer codegen
        run: node scripts/t011-codegen-compatibility.mjs
      - name: Actually generate Shopify GraphQL types
        run: npm run graphql-codegen
      - name: Assert generated operation types are nonempty
        run: |
          test -d app/types
          if ! find app/types -type f \( -name '*.ts' -o -name '*.tsx' \) -size +0c | grep -q .; then
            echo 'BLOCKED T011: generator produced no nonempty TypeScript declarations'
            exit 1
          fi
      - name: Enforce zero high-severity advisories in full dependency tree
        run: npm audit --include=dev --audit-level=high
