name: VSN Paid Plans and Mutation Integration QA
on:
  pull_request:
    paths:
      - ".github/workflows/paid-guard-integration-qa.yml"
      - "app/config/commercialPlans.js"
      - "app/services/entitlements.server.js"
      - "app/utils/paid-mutation-access.js"
      - "app/utils/paid-mutation-guard.server.js"
      - "tests/builder-four-paid-plans.test.mjs"
      - "tests/paid-mutation-access.test.mjs"
      - "tests/t026-action-exceptions.test.mjs"
      - "scripts/milestone-g-engineering-audit.mjs"
      - "scripts/milestone-q51-shopify-app-pricing-foundation-audit.mjs"
      - "scripts/milestone-q52-shopify-subscription-sync-audit.mjs"
      - "scripts/milestone-q53-entitlement-engine-audit.mjs"
      - "scripts/milestone-q54-billing-lifecycle-ux-audit.mjs"
      - "scripts/milestone-q55-billing-production-lifecycle-audit.mjs"
      - "docs/developer/billing-production-qa.md"
      - "app/components/dashboard/pages/Pricing.jsx"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify commercial pricing and runtime mutation gate contracts
        run: node --test tests/builder-four-paid-plans.test.mjs tests/paid-mutation-access.test.mjs tests/t026-action-exceptions.test.mjs
      - name: Ensure Milestone G plan UX and authority contracts are still met
        run: node scripts/milestone-g-engineering-audit.mjs
      - name: Verify Q5.1-Q5.5 Shopify-managed pricing lifecycle contracts
        run: |
          node scripts/milestone-q51-shopify-app-pricing-foundation-audit.mjs
          node scripts/milestone-q52-shopify-subscription-sync-audit.mjs
          node scripts/milestone-q53-entitlement-engine-audit.mjs
          node scripts/milestone-q54-billing-lifecycle-ux-audit.mjs
          node scripts/milestone-q55-billing-production-lifecycle-audit.mjs
      - name: Inventory all app mutation actions
        run: node scripts/t026-mutation-inventory.mjs
      - name: Review JavaScript syntax in policy and guard modules
        run: |
          node --check app/config/commercialPlans.js
          node --check app/services/entitlements.server.js
          node --check app/utils/paid-mutation-access.js
          node --check app/utils/paid-mutation-guard.server.js
      - name: Attach action inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paid-guard-integration-inventory
          path: t026-mutation-inventory.json
          if-no-files-found: warn
