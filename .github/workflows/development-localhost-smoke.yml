name: VSN Builder Development Localhost Smoke (No Deploy)
on:
  pull_request:
    paths:
      - ".github/workflows/development-localhost-smoke.yml"
      - "scripts/local-development.mjs"
      - "scripts/dev-loopback-smoke.mjs"
      - "tests/development-localhost-workflow.test.mjs"
      - ".env.local.example"
      - "shopify.app.local.template.toml"
      - "scripts/prepare-database.mjs"
  push:
    branches: [development]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: builder-local-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-development:
    name: Clean checkout + disposable SQLite + localhost auth boundary
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      NODE_ENV: test
      APP_ENV: development
      SHOPIFY_BILLING_TEST_MODE: "true"
      # Shopify Client ID is public. A synthetic secret is used ONLY for
      # completely offline CI; no Shopify Admin/Partner/OAuth requests.
      SHOPIFY_API_KEY: "f6156da0bd799053f2f0bd0f9e10983c"
      SHOPIFY_API_SECRET: "synthetic-ci-only-shopify-secret"
      SHOPIFY_APP_URL: http://127.0.0.1:3473
      DATABASE_URL: file:./ci.sqlite
    steps:
      - name: Checkout exact commit without persisted GitHub credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup pinned supported Node 22.18.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.18.0"
          cache: npm
      - name: Assert Local CI never receives hosted deploy credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$APP_ENV" = development
          test "$SHOPIFY_BILLING_TEST_MODE" = true
          test "$DATABASE_URL" = file:./ci.sqlite
          test -z "${NEON_API_KEY:-}"
          test -z "${NEON_PROJECT_ID:-}"
          test -z "${DIRECT_URL:-}"
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          node --test tests/development-localhost-workflow.test.mjs
      - name: Install lockfile-pinned application dependencies
        run: npm ci
      - name: Validate isolated repo/local contracts and dependency security
        run: npm run env:check && npm run env:test && npm audit --omit=dev --audit-level=high
      - name: Materialize ignored Local/Dev env and generate real SQLite app configuration
        shell: bash
        run: |
          set -euo pipefail
          # GitHub Actions checks out a detached SHA. Create a runner-local
          # test/* branch pointing at that exact SHA; never push any ref.
          git switch -c test/ci-disposable-local
          cp .env.local.example .env.local
          printf '\nSHOPIFY_API_SECRET=%s\n' "$SHOPIFY_API_SECRET" >> .env.local
          chmod 600 .env.local
          npm run local:prepare
          npm run env:local:check
          test -f shopify.app.local.toml
          grep -q 'client_id = "f6156da0bd799053f2f0bd0f9e10983c"' shopify.app.local.toml
          test ! -e shopify.app.production.toml
      - name: Build real isolated React Router application
        run: npm run build
      - name: Launch localhost and check Shopify auth boundary without external requests
        run: node scripts/dev-loopback-smoke.mjs
      - name: Assert only disposable ignored local output was generated
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- shopify.app.toml shopify.app.staging.toml \
            shopify.app.production.template.toml config/deployment/environments.json \
            workers/app.js wrangler.staging.jsonc wrangler.production.jsonc
          git check-ignore -q .env.local
          git check-ignore -q shopify.app.local.toml
          test -z "$(git status --porcelain --untracked-files=normal | grep -E '^\?\? (.env.local|shopify.app.local.toml)$' || true)"
          echo 'Local/Dev CI PASS: no Shopify install, no Neon/Cloudflare, no Staging/Production mutation.'
