name: T024 Shopify GDPR Redaction Generation Fence (No Deploy)
on:
  pull_request:
    branches: [development]
    paths:
      - "app/routes/webhooks.shop.redact.jsx"
      - "app/services/shopify-shop-redact-guard.js"
      - "app/services/shop-data-lifecycle.server.js"
      - "tests/t024-shop-redact-generation-fence.test.mjs"
      - ".github/workflows/t024-shop-redact-generation-fence.yml"
  push:
    branches: [development]
    paths:
      - "app/routes/webhooks.shop.redact.jsx"
      - "app/services/shopify-shop-redact-guard.js"
      - "app/services/shop-data-lifecycle.server.js"
      - "tests/t024-shop-redact-generation-fence.test.mjs"
      - ".github/workflows/t024-shop-redact-generation-fence.yml"
permissions:
  contents: read
# Cancel superseded pull_request runs only; protected-branch pushes always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  sdk-authenticated-gdpr-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.18.0
      - name: Refuse active-install deletion and wrong-topic redaction using actual route VM
        run: node --test tests/t024-shop-redact-generation-fence.test.mjs
      - name: Confirm no real merchant, Neon or Worker credentials accessed
        run: |
          test -z "${NEON_API_KEY:-}"
          test -z "${SHOPIFY_API_SECRET:-}"
          test -z "${CLOUDFLARE_API_TOKEN:-}"
