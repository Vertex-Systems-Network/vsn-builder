name: T015 Existing Three Shopify Stores Contract (No New Store)
on:
  pull_request:
    branches: [development]
    paths:
      - "config/deployment/environments.json"
      - "shopify.app.local.template.toml"
      - "tests/t015-existing-shopify-stores.test.mjs"
      - ".github/workflows/t015-existing-shopify-stores.yml"
permissions:
  contents: read
jobs:
  existing-stores:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Checkout proposed source without persist credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Use pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.18.0"
      - name: Verify existing local, staging and live store contracts
        run: node --test tests/t015-existing-shopify-stores.test.mjs
