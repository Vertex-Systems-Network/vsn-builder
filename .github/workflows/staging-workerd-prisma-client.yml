name: VSN Builder Staging Workerd Prisma Client
on:
  pull_request:
    paths:
      - "prisma/cloud/**"
      - ".gitignore"
      - "scripts/staging-cloud-client-verify.mjs"
      - "tests/staging-cloud-client-verify.test.mjs"
      - ".github/workflows/staging-workerd-prisma-client.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-client-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://staging_test:unused@127.0.0.1:5432/placeholder?sslmode=require
      DIRECT_URL: postgresql://staging_test:unused@127.0.0.1:5432/placeholder?sslmode=require
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify zero-trust generator contract
        run: node --test tests/staging-cloud-client-verify.test.mjs
      - name: Reproducible Prisma dependencies
        run: npm ci
      - name: Generate isolated PostgreSQL Node and Workerd client without database access
        run: npm run prisma -- generate --schema prisma/cloud/schema.prisma
      - name: Verify actually generated clients and isolated local SQLite
        run: node scripts/staging-cloud-client-verify.mjs --generated
      - name: Enforce clean dependency audit
        run: npm audit --include=dev --audit-level=high
