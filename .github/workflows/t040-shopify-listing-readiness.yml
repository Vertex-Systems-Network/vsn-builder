name: T040 Shopify App Store Listing Draft Safety (No Deploy)
on:
  pull_request:
    paths:
      - "docs/launch/shopify-builder-app-store-draft.md"
      - "config/shopify-listing-readiness.json"
      - "scripts/t040-shopify-listing-readiness.mjs"
      - "scripts/t040-shopify-screenshot-evidence.mjs"
      - "tests/t040-shopify-screenshot-evidence.test.mjs"
      - "tests/t040-shopify-listing-readiness.test.mjs"
      - "app/config/commercialPlans.js"
      - ".github/workflows/t040-shopify-listing-readiness.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  listing-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (read-only, no saved token)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pinned Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.18.0"
      - name: Validate truthful draft only (never submit)
        run: node scripts/t040-shopify-listing-readiness.mjs
      - name: Assert that real evidence is mandatory before publication
        run: node --test tests/t040-shopify-listing-readiness.test.mjs tests/t040-shopify-screenshot-evidence.test.mjs
