name: VSN Builder Development Chromium Browser Acceptance (No Deploy)
on:
  push:
    branches: [feat/builder-dev-browser-acceptance-20261013, fix/builder-dev-graphql-tools-cve-20261013, development]
  pull_request:
    paths:
      - ".github/workflows/dev-chromium-browser-acceptance.yml"
      - "scripts/dev-browser-chromium.mjs"
      - "scripts/t020-staging-real-chromium.mjs"
      - "workers/staging-editor-ui.js"
      - "app/services/worker-shopify-staging-editor-html.js"
      - "app/services/worker-shopify-staging-dashboard.js"
      - "tests/phase34-hosted-worker-gate.test.mjs"
      - "tests/t020-worker-draft-save-contract.test.mjs"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vsn-builder-dev-chromium-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chromium-local:
    name: Built SQLite Dev app in real Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      NODE_ENV: test
      APP_ENV: development
      SHOPIFY_BILLING_TEST_MODE: 'true'
      SHOPIFY_API_KEY: '0123456789abcdef0123456789abcdef'
      SHOPIFY_API_SECRET: synthetic-ci-only-shopify-secret
      SHOPIFY_APP_URL: http://127.0.0.1:3473
      DATABASE_URL: file:./ci.sqlite
    steps:
      - name: Checkout read-only without git credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          cache: npm
      - name: Install exact app dependencies
        run: npm ci
      - name: Check Dev-only isolation and production package security
        run: npm run env:check && npm run env:test && npm audit --omit=dev --audit-level=high
      - name: Build disposable SQLite schema
        run: |
          npm run prisma -- generate
          npm run prisma -- migrate deploy
      - name: Build the actual React Router application
        run: npm run build
      - name: Install pinned Playwright browser tooling outside tracked lockfile
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.64.0
          npx playwright install chromium --with-deps
          git diff --exit-code -- package.json package-lock.json
      - name: Run real desktop/mobile Chromium UI and protected route acceptance
        run: node scripts/dev-browser-chromium.mjs
      - name: Upload synthetic local-only browser screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsn-builder-development-browser-evidence
          path: dev-browser-artifacts/
          if-no-files-found: ignore
          retention-days: 5
      - name: Generate disposable Prisma Edge client for source-only Worker contract tests
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=require
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=require
        run: |
          # prisma generate is offline: no Neon access, migration or Worker deploy.
          npx prisma generate --schema prisma/cloud/schema.prisma
          node scripts/verify-prisma-worker-client.mjs --generated
      - name: Real Chromium synthetic Shopify merchant editor create-save-reload and mobile
        run: node scripts/t020-staging-real-chromium.mjs
      - name: Verify isolated Development test and guarded hosted Worker source (No Deploy)
        shell: bash
        run: |
          set -euo pipefail
          # The reviewed Staging/Production Worker manifests are source files,
          # not evidence of a deployment. Never require these files to be
          # absent: verify that they are fail-closed instead.
          test "$APP_ENV" = development
          test "$DATABASE_URL" = file:./ci.sqlite
          test "$SHOPIFY_APP_URL" = http://127.0.0.1:3473
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${NEON_API_KEY:-}"
          test -z "${NEON_DATABASE_URL:-}"
          node --test tests/phase34-hosted-worker-gate.test.mjs
          node --test tests/t020-worker-draft-save-contract.test.mjs
          git diff --exit-code -- workers/app.js wrangler.staging.jsonc wrangler.production.jsonc
          echo "PASS synthetic Chromium acceptance never touched hosted Worker source or deployed."
