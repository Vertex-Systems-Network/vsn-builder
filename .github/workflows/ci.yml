name: VSN Production Confidence
on:
  # Feature-branch pushes duplicated the pull_request run for the same code;
  # protected-credential QA/E2E only ever ran on development/main pushes.
  push:
    branches: [development, main]
  pull_request:
  workflow_dispatch:
# A newer commit on the same PR supersedes the older run; protected-branch
# pushes are never cancelled so every merged SHA keeps its full evidence.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: file:./ci.sqlite
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - name: Validate mandatory audit gate continuity
        run: node --test tests/ci-audit-gate-continuity.test.mjs
      # Capture audit status without aborting non-credentialed QA. The final
      # always()-running enforcement step MUST fail the required verify job
      # unless every mandatory audit succeeds. This is not an audit exemption.
      - name: Production dependency audit
        id: production_audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Development dependency audit
        id: development_audit
        continue-on-error: true
        run: npm audit --include=dev --audit-level=high
      - run: npm run security:audit
      - name: Legacy webhook egress security audit
        run: node scripts/legacy-webhook-egress-audit.mjs
      - run: npm run prisma -- generate
      - run: npm run prisma -- migrate deploy
      - name: Repository lint (blocking)
        run: npm run lint -- --format json --output-file lint-report.json
      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-report
          path: lint-report.json
          if-no-files-found: warn
          retention-days: 1
      - run: npm run typecheck
      - run: npm run build
      - name: Run release QA
        id: release_qa
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run qa:release 2>&1 | tee qa-release.log
      - name: Upload release QA diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-release-log
          path: qa-release.log
          if-no-files-found: warn
          retention-days: 1
      - name: Enforce release QA result
        if: steps.release_qa.outcome == 'failure'
        run: exit 1
      - name: Upload deterministic AI eval artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-eval-deterministic
          path: artifacts/ai-evals/deterministic-v1.json
          if-no-files-found: warn
          retention-days: 7
      - name: Run external phase-1 QA with protected credentials
        if: github.event_name != 'pull_request' && github.ref_protected == true && (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main') && steps.production_audit.outcome == 'success' && steps.development_audit.outcome == 'success'
        run: npm run qa:phase1
        env:
          VSN_E2E_STORE_URL: ${{ secrets.VSN_E2E_STORE_URL }}
          VSN_E2E_EDITOR_URL: ${{ secrets.VSN_E2E_EDITOR_URL }}
          VSN_E2E_PAGE_ID: ${{ secrets.VSN_E2E_PAGE_ID }}
          VSN_E2E_THEME_MATRIX: ${{ secrets.VSN_E2E_THEME_MATRIX }}
      - run: npm run performance:large-pages
      # Do not install browser tooling while the original audit remains red.
      # This avoids unnecessary runners/dependency churn without passing CI.
      - if: steps.production_audit.outcome == 'success' && steps.development_audit.outcome == 'success'
        run: npm install --no-save --package-lock=false @playwright/test@1.63.0
      - name: Audit post-Playwright dependency state
        id: post_playwright_audit
        if: steps.production_audit.outcome == 'success' && steps.development_audit.outcome == 'success'
        continue-on-error: true
        run: npm audit --include=dev --audit-level=high
      - name: Assert no PR browser install while mandatory post-install audit remains enforced
        run: node --test tests/ci-browser-install-guard.test.mjs
      # Only protected, allowlisted branches may reach external Shopify E2E.
      # PRs and unprotected feature pushes cannot use hosted test credentials.
      # The mandatory post-Playwright dependency audit above runs on EVERY PR.
      - if: github.event_name != 'pull_request' && github.ref_protected == true && (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main') && steps.production_audit.outcome == 'success' && steps.development_audit.outcome == 'success' && steps.post_playwright_audit.outcome == 'success'
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run external Playwright E2E with protected credentials
        if: github.event_name != 'pull_request' && github.ref_protected == true && (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main') && steps.production_audit.outcome == 'success' && steps.development_audit.outcome == 'success' && steps.post_playwright_audit.outcome == 'success'
        run: npm run e2e:playwright
        env:
          VSN_E2E_STORE_URL: ${{ secrets.VSN_E2E_STORE_URL }}
          VSN_E2E_EDITOR_URL: ${{ secrets.VSN_E2E_EDITOR_URL }}
          VSN_E2E_PAGE_ID: ${{ secrets.VSN_E2E_PAGE_ID }}
      - name: Enforce all mandatory dependency audits
        if: always()
        shell: bash
        env:
          PROD_AUDIT: ${{ steps.production_audit.outcome }}
          DEV_AUDIT: ${{ steps.development_audit.outcome }}
          POST_PLAYWRIGHT_AUDIT: ${{ steps.post_playwright_audit.outcome }}
        run: |
          set -euo pipefail
          failures=0
          if [[ "$PROD_AUDIT" != "success" ]]; then
            echo "::error::Mandatory Production dependency audit did not pass"
            failures=1
          fi
          if [[ "$DEV_AUDIT" != "success" ]]; then
            echo "::error::Mandatory Development dependency audit did not pass"
            failures=1
          fi
          if [[ "$POST_PLAYWRIGHT_AUDIT" != "success" ]]; then
            echo "::error::Mandatory post-Playwright dependency audit did not pass or was skipped"
            failures=1
          fi
          if (( failures )); then
            echo "::error::VSN Production Confidence remains FAILED; no security exception or deployment authorization"
            exit 1
          fi
          echo "PASS all three mandatory dependency audit gates"
