name: VSN Production Confidence
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: file:./ci.sqlite
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npm run prisma -- generate
      - run: npm run prisma -- migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run qa:release
      - run: npm run qa:phase1
        env:
          VSN_E2E_STORE_URL: ${{ secrets.VSN_E2E_STORE_URL }}
          VSN_E2E_EDITOR_URL: ${{ secrets.VSN_E2E_EDITOR_URL }}
          VSN_E2E_PAGE_ID: ${{ secrets.VSN_E2E_PAGE_ID }}
          VSN_E2E_THEME_MATRIX: ${{ secrets.VSN_E2E_THEME_MATRIX }}
      - run: npm run performance:large-pages
      - run: npm install --no-save --package-lock=false @playwright/test@1.55.0
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run e2e:playwright
        env:
          VSN_E2E_STORE_URL: ${{ secrets.VSN_E2E_STORE_URL }}
          VSN_E2E_EDITOR_URL: ${{ secrets.VSN_E2E_EDITOR_URL }}
          VSN_E2E_PAGE_ID: ${{ secrets.VSN_E2E_PAGE_ID }}
