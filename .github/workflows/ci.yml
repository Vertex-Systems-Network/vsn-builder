name: VSN Production Confidence
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: file:./ci.sqlite
      NODE_ENV: test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run prisma -- generate
      - run: npm run prisma -- migrate deploy
      - name: Lint changed source files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" && -n "$PR_BASE_SHA" ]]; then
            base="$PR_BASE_SHA"
          elif [[ -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]] && git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null; then
            base="$PUSH_BEFORE_SHA"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            base="$(git rev-parse HEAD^)"
          else
            base="$(git rev-list --max-parents=0 HEAD)"
          fi
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base"...HEAD -- '*.js' '*.jsx' '*.mjs' '*.cjs' '*.ts' '*.tsx')
          if ((${#files[@]})); then
            printf 'Linting changed source files:\n%s\n' "${files[@]}"
            npx eslint --ignore-path .gitignore --no-cache "${files[@]}"
          else
            echo "No changed JS/TS source files to lint."
          fi
      - run: npm run typecheck
      - run: npm run build
      - run: npm run security:audit
      - run: npm run qa:release
      - run: npm run qa:phase1
        env:
          VSN_E2E_STORE_URL: ${{ secrets.VSN_E2E_STORE_URL }}
          VSN_E2E_EDITOR_URL: ${{ secrets.VSN_E2E_EDITOR_URL }}
          VSN_E2E_PAGE_ID: ${{ secrets.VSN_E2E_PAGE_ID }}
          VSN_E2E_THEME_MATRIX: ${{ secrets.VSN_E2E_THEME_MATRIX }}
      - run: npm run performance:large-pages
      - run: npm install --no-save --package-lock=false @playwright/test@1.55.0
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run e2e:playwright
        env:
          VSN_E2E_STORE_URL: ${{ secrets.VSN_E2E_STORE_URL }}
          VSN_E2E_EDITOR_URL: ${{ secrets.VSN_E2E_EDITOR_URL }}
          VSN_E2E_PAGE_ID: ${{ secrets.VSN_E2E_PAGE_ID }}
