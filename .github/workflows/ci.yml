name: VSN Production Confidence
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: file:./ci.sqlite
      NODE_ENV: test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run prisma -- generate
      - run: npm run prisma -- migrate deploy
      - name: Lint
        run: npx eslint --cache --cache-location ./node_modules/.cache/eslint --format json --output-file lint-report.json .
      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: lint-report
          path: lint-report.json
          if-no-files-found: error
          retention-days: 1
      - run: npm run typecheck
      - run: npm run build
      - run: npm run qa:release
      - run: npm run qa:phase1
        env:
          VSN_E2E_STORE_URL: ${{ secrets.VSN_E2E_STORE_URL }}
          VSN_E2E_EDITOR_URL: ${{ secrets.VSN_E2E_EDITOR_URL }}
          VSN_E2E_PAGE_ID: ${{ secrets.VSN_E2E_PAGE_ID }}
          VSN_E2E_THEME_MATRIX: ${{ secrets.VSN_E2E_THEME_MATRIX }}
      - run: npm run performance:large-pages
      - run: npm install --no-save --package-lock=false @playwright/test@1.55.0
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run e2e:playwright
        env:
          VSN_E2E_STORE_URL: ${{ secrets.VSN_E2E_STORE_URL }}
          VSN_E2E_EDITOR_URL: ${{ secrets.VSN_E2E_EDITOR_URL }}
          VSN_E2E_PAGE_ID: ${{ secrets.VSN_E2E_PAGE_ID }}
