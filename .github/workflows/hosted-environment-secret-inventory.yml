name: VSN Legacy Hosted Secret Inventory — Retired (Not Acceptance)
# Historical basic-format inventory was weaker than the canonical Phase 1
# protected identity preflight: it self-assigned APP_ENV and billing flags
# and never proved Neon/Worker tier, all three Shopify IDs or environment scope.
# Keep a safe, clearly failing dispatch entry instead of silent skipped success.
# This workflow NEVER selects a GitHub Environment or injects any secret.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging-inventory:
    if: github.event_name == 'workflow_dispatch' && github.ref_protected == true && github.ref == 'refs/heads/development'
    name: Retired Staging inventory — not acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Retired legacy check must fail closed
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Legacy inventory is retired and NOT Phase 1 acceptance. Use the manual 'VSN Phase 1 Protected Identity Preflight (No Deploy)' on a protected development branch."
          exit 1
  production-inventory:
    if: github.event_name == 'workflow_dispatch' && github.ref_protected == true && github.ref == 'refs/heads/main'
    name: Retired Production inventory — not acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Retired legacy check must fail closed
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Legacy inventory is retired and NOT Phase 1 acceptance. Use the manual 'VSN Phase 1 Protected Identity Preflight (No Deploy)' on protected main."
          exit 1
