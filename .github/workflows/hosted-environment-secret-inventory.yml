name: VSN Hosted Environment Secret Inventory (No Deploy)
# Read-only scoped secret syntax check; no Shopify/DB/Cloudflare API calls,
# no checkout, no npm install, and no source code execution with credentials.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging-inventory:
    # Only protected source branches may access scoped secrets.
    if: github.event_name == 'workflow_dispatch' && github.ref_protected == true && (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main')
    name: Staging secret names and shape ONLY
    environment: cloudflare-staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_ENV: staging
      SHOPIFY_BILLING_TEST_MODE: 'true'
      SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
      SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
      SHOPIFY_APP_URL: ${{ secrets.SHOPIFY_APP_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_WORKER_NAME: vsn-builder-staging
    steps:
      - name: Staging scoped values presence and basic syntax without printing values
        shell: bash
        run: |
          set +x
          set -euo pipefail
          failures=0
          for name in SHOPIFY_API_KEY SHOPIFY_API_SECRET SHOPIFY_APP_URL DATABASE_URL DIRECT_URL CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [[ -z "${!name:-}" ]]; then echo "::error::Missing staging secret: $name"; failures=1; fi
          done
          [[ "$SHOPIFY_API_KEY" =~ ^[0-9a-fA-F]{32}$ ]] || { echo "::error::Staging Shopify Client ID format invalid"; failures=1; }
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]] || { echo "::error::Cloudflare account ID format invalid"; failures=1; }
          [[ "$SHOPIFY_APP_URL" == https://* ]] || { echo "::error::Staging Shopify URL must be HTTPS"; failures=1; }
          [[ "$DATABASE_URL" == postgres://* || "$DATABASE_URL" == postgresql://* ]] || { echo "::error::Staging DATABASE_URL must be PostgreSQL"; failures=1; }
          [[ "$DIRECT_URL" == postgres://* || "$DIRECT_URL" == postgresql://* ]] || { echo "::error::Staging DIRECT_URL must be PostgreSQL"; failures=1; }
          if [[ "$DATABASE_URL" == "$DIRECT_URL" ]]; then echo "::error::Staging pooled/direct URLs must differ"; failures=1; fi
          if (( failures > 0 )); then exit 1; fi
          echo "Staging secret inventory presence/format PASS. No connectivity or deployment verified."
  production-inventory:
    # Never expose Live environment credentials to a feature/pull-request branch.
    if: github.event_name == 'workflow_dispatch' && github.ref_protected == true && github.ref == 'refs/heads/main'
    name: Production secret names and shape ONLY
    environment: cloudflare-production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_ENV: production
      SHOPIFY_BILLING_TEST_MODE: 'false'
      SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
      SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
      SHOPIFY_PRODUCTION_CLIENT_ID: ${{ secrets.SHOPIFY_PRODUCTION_CLIENT_ID }}
      SHOPIFY_APP_URL: ${{ secrets.SHOPIFY_APP_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_WORKER_NAME: vsn-builder-production
    steps:
      - name: Production scoped values presence and basic syntax without printing values
        shell: bash
        run: |
          set +x
          set -euo pipefail
          failures=0
          for name in SHOPIFY_API_KEY SHOPIFY_API_SECRET SHOPIFY_PRODUCTION_CLIENT_ID SHOPIFY_APP_URL DATABASE_URL DIRECT_URL CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [[ -z "${!name:-}" ]]; then echo "::error::Missing production secret: $name"; failures=1; fi
          done
          [[ "$SHOPIFY_API_KEY" =~ ^[0-9a-fA-F]{32}$ ]] || { echo "::error::Production Shopify Client ID format invalid"; failures=1; }
          if [[ "$SHOPIFY_API_KEY" != "$SHOPIFY_PRODUCTION_CLIENT_ID" ]]; then echo "::error::Production Shopify ID mismatch"; failures=1; fi
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]] || { echo "::error::Cloudflare account ID format invalid"; failures=1; }
          [[ "$SHOPIFY_APP_URL" == https://* ]] || { echo "::error::Production Shopify URL must be HTTPS"; failures=1; }
          [[ "$DATABASE_URL" == postgres://* || "$DATABASE_URL" == postgresql://* ]] || { echo "::error::Production DATABASE_URL must be PostgreSQL"; failures=1; }
          [[ "$DIRECT_URL" == postgres://* || "$DIRECT_URL" == postgresql://* ]] || { echo "::error::Production DIRECT_URL must be PostgreSQL"; failures=1; }
          if [[ "$DATABASE_URL" == "$DIRECT_URL" ]]; then echo "::error::Production pooled/direct URLs must differ"; failures=1; fi
          if (( failures > 0 )); then exit 1; fi
          echo "Production secret inventory presence/format PASS. No connectivity or deployment verified."
