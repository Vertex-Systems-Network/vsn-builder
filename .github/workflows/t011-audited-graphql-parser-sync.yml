name: T011 Audited GraphQL Parser Verification
on:
  pull_request:
    paths:
      - ".github/workflows/t011-audited-graphql-parser-sync.yml"
      - "scripts/t011-graphql-ast-analysis.mjs"
      - "scripts/t011-shopify-admin-schema-validation.mjs"
      - "scripts/t011-graphql-document-inventory.mjs"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audited-parser-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce dependency tree
        run: npm ci
      - name: Require full dependency audit and pinned standalone parser
        run: |
          npm audit --include=dev --audit-level=high
          npm ls graphql --depth=0
      - name: Analyze actual Shopify GraphQL operation strings
        run: |
          node scripts/t011-graphql-document-inventory.mjs
          node scripts/t011-graphql-ast-analysis.mjs
          node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync('t011-graphql-ast-report.json')); if(!r.parserAvailable || r.discoveredDocuments===0 || r.valid===0) process.exit(1); console.log('Valid AST documents',r.valid,'of',r.discoveredDocuments)"
      - name: Validate parsed operations using official versioned Shopify Admin schema
        run: node scripts/t011-shopify-admin-schema-validation.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t011-graphql-ast-report
          path: |
            t011-graphql-operation-inventory.json
            t011-graphql-ast-report.json
            t011-shopify-admin-schema-report.json
          if-no-files-found: warn
