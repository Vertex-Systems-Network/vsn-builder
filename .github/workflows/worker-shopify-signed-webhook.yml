name: VSN Worker Shopify Signed Webhook Verification (No Deploy)
on:
  push:
    branches: [feat/builder-worker-signed-webhook-20261013]
permissions:
  contents: read
jobs:
  signed-webhook:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CI: 'true'
      NODE_ENV: test
      APP_ENV: development
      DATABASE_URL: file:./ci.sqlite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          cache: npm
      - name: Exact npm dependency install
        run: npm ci
      - name: Generate isolated Prisma Worker client offline
        env:
          DATABASE_URL: postgresql://ci:unused@127.0.0.1:5432/ci
          DIRECT_URL: postgresql://ci:unused@127.0.0.1:5432/ci
        run: npx prisma generate --schema prisma/cloud/schema.prisma
      - name: Verify real Shopify SDK signed webhook acceptance and failure cases
        run: node --test tests/worker-shopify-webhook-gate.test.mjs
      - name: Verify SDK bootstrap, persistent sessions, and Web Streams CSP
        run: |
          node --test tests/worker-real-shopify-sdk.test.mjs
          node --test tests/shopify-worker-session-context.test.mjs
          node --test tests/worker-ssr-webstream.test.mjs
      - name: Enforce patched GraphQL Tools and canonical Shopify codegen
        run: |
          node scripts/check-patched-graphql-tools.mjs
          node scripts/check-shopify-graphql-codegen.mjs
      - name: Production dependency security check
        run: npm audit --omit=dev --audit-level=high
      - name: Never produce hosted deployment artifacts
        run: |
          test ! -e workers/app.js
          test ! -e wrangler.staging.jsonc
          test ! -e wrangler.production.jsonc
