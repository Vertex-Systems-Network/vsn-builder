name: T041 Production Deploy — Protected Manual Only
# Promotes the EXACT protected main SHA to Production (vsn-builder-production) after
# explicit owner approval. Never runs on PRs, forks or development. Secret values come
# only from the protected cloudflare-production GitHub environment.
# Order: Neon backup branch -> prisma migrate deploy -> Worker deploy -> live probes.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY_MAIN_SHA_TO_PRODUCTION to deploy; anything else refuses"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: vsn-builder-production-deploy
  cancel-in-progress: false
jobs:
  migrate-production-database:
    if: github.ref == 'refs/heads/main' && github.ref_protected == true && inputs.confirmation == 'DEPLOY_MAIN_SHA_TO_PRODUCTION'
    runs-on: ubuntu-24.04
    environment: cloudflare-production
    timeout-minutes: 20
    env:
      CI: "true"
      APP_ENV: production
      NEON_PROJECT_ID: nameless-violet-68750490
      NEON_DEFAULT_BRANCH_ID: br-odd-credit-b3rzlpz9
    steps:
      - name: Checkout exact protected main SHA without GitHub write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Use pinned Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.18.0"
          cache: npm
      - name: Require Production database secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY || secrets.NEON_API_TOKEN || secrets.NEON_TOKEN }}
        run: |
          set +x
          missing=""
          for name in DATABASE_URL DIRECT_URL NEON_API_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing cloudflare-production secrets:$missing"
            exit 1
          fi
          case "$DIRECT_URL" in *ep-jolly-truth-b3xbibzp*) ;; *) echo "::error::DIRECT_URL is not the Production Neon endpoint"; exit 1;; esac
          case "$DATABASE_URL" in *ep-jolly-truth-b3xbibzp*) ;; *) echo "::error::DATABASE_URL is not the Production Neon endpoint"; exit 1;; esac
      - name: Create a Neon backup branch of Production before migrating
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY || secrets.NEON_API_TOKEN || secrets.NEON_TOKEN }}
        run: |
          set +x
          name="backup-before-${GITHUB_SHA::12}-${GITHUB_RUN_ID}"
          response=$(curl -fsS --max-time 60 -X POST \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches" \
            -H "Authorization: Bearer ${NEON_API_KEY}" -H "Content-Type: application/json" \
            --data "{\"branch\":{\"name\":\"${name}\",\"parent_id\":\"${NEON_DEFAULT_BRANCH_ID}\"}}")
          printf '%s' "$response" | jq -e --arg n "$name" '.branch.name == $n' >/dev/null
          echo "Backup branch: $name" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install exact dependency lockfile
        run: npm ci
      - name: Apply ONLY reviewed Prisma cloud migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma migrate deploy --schema prisma/cloud/schema.prisma
      - name: Verify required Production tables exist (read only)
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set +x
          count=$(psql "$DIRECT_URL" -At -v ON_ERROR_STOP=1 -c "BEGIN READ ONLY; SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('Session','BuilderPage','BuilderSubscription','BuilderShopInstallation','_prisma_migrations'); COMMIT;" | sed -n 2p)
          echo "Required tables present: $count/5"
          [ "$count" = "5" ]

  deploy-production-worker:
    needs: migrate-production-database
    if: github.ref == 'refs/heads/main' && github.ref_protected == true && inputs.confirmation == 'DEPLOY_MAIN_SHA_TO_PRODUCTION'
    runs-on: ubuntu-24.04
    environment: cloudflare-production
    timeout-minutes: 30
    env:
      CI: "true"
      APP_ENV: production
      WRANGLER_SEND_METRICS: "false"
      PRODUCTION_URL: https://vsn-builder-production.vertexsystemsnetwork.workers.dev
    steps:
      - name: Checkout exact protected main SHA without GitHub write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Use pinned Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.18.0"
          cache: npm
      - name: Install exact dependency lockfile
        run: npm ci
      - name: Install isolated Cloudflare Wrangler via already-certified Vite plugin version
        run: |
          npm install --no-save --package-lock=false --no-audit @cloudflare/vite-plugin@1.64.0
          test -x ./node_modules/.bin/wrangler
          git diff --exit-code -- package.json package-lock.json
      - name: Verify Production deploy guard contracts
        run: node --test tests/t041-production-deploy-policy.test.mjs tests/worker-hosted-tier.test.mjs
      - name: Generate compiled hosted Prisma Edge client without real DB access
        env:
          DATABASE_URL: postgresql://ci:fake@localhost:5432/ci?sslmode=require
          DIRECT_URL: postgresql://ci:fake@localhost:5432/ci?sslmode=require
        run: npx prisma generate --schema prisma/cloud/schema.prisma
      - name: Build the full Shopify React Router Production Worker
        env:
          VSN_PRODUCTION_FULL_APP_BUILD: "1"
          DATABASE_URL: postgresql://build:unused@localhost:5432/build?sslmode=require
          DIRECT_URL: postgresql://build:unused@localhost:5432/build?sslmode=require
        run: |
          ./node_modules/.bin/react-router build --config vite.production-cloudflare.config.js
          test -s dist/server/index.js
          test -s dist/server/wrangler.json
          jq -e '.name == "vsn-builder-production" and .vars.APP_ENV == "production" and .vars.SHOPIFY_BILLING_TEST_MODE == "false"' dist/server/wrangler.json >/dev/null
      - name: Deploy exact SHA to the Production Worker only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PRODUCTION_SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
          PRODUCTION_SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
          PRODUCTION_SHOPIFY_PARTNER_API_ACCESS_TOKEN: ${{ secrets.SHOPIFY_PARTNER_API_ACCESS_TOKEN }}
        run: |
          set +x
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          secret_file="$RUNNER_TEMP/vsn-production-secrets.json"
          umask 077
          trap 'rm -f "$secret_file"' EXIT
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          import { join } from "node:path";
          const secrets = {
            DATABASE_URL: process.env.PRODUCTION_DATABASE_URL,
            SHOPIFY_API_KEY: process.env.PRODUCTION_SHOPIFY_API_KEY,
            SHOPIFY_API_SECRET: process.env.PRODUCTION_SHOPIFY_API_SECRET,
            SHOPIFY_PARTNER_API_TOKEN: process.env.PRODUCTION_SHOPIFY_PARTNER_API_ACCESS_TOKEN,
          };
          const missing = Object.entries(secrets).filter(([, value]) => !value).map(([name]) => name);
          if (missing.length) {
            console.error("Missing required GitHub cloudflare-production environment secrets: " + missing.join(", "));
            process.exit(1);
          }
          if (secrets.SHOPIFY_API_KEY.trim().toLowerCase() !== "997eae5a9961f21d131e5f31bbbe31d3") {
            console.error("SHOPIFY_API_KEY is not the canonical public Builder app client ID");
            process.exit(1);
          }
          writeFileSync(join(process.env.RUNNER_TEMP, "vsn-production-secrets.json"), JSON.stringify(secrets), { mode: 0o600 });
          NODE
          ./node_modules/.bin/wrangler deploy --config dist/server/wrangler.json --secrets-file "$secret_file" --message "main ${GITHUB_SHA}"
      - name: Enforce Production log query-string redaction
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +x
          response=$(curl -fsS --max-time 30 -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/vsn-builder-production/script-settings" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"observability":{"enabled":true,"redact_query_string":true,"logs":{"enabled":true,"invocation_logs":true,"head_sampling_rate":1,"persist":true},"traces":{"enabled":true,"head_sampling_rate":1,"persist":true},"issues":{"enabled":true}}}')
          printf '%s' "$response" | jq -e '.success == true and .result.observability.redact_query_string == true' >/dev/null
          echo "PASS: Production request query strings are redacted in logs"
      - name: Confirm no dependency or config drift
        if: always()
        run: git diff --exit-code -- package.json package-lock.json wrangler.production-full.jsonc
      - name: Live smoke checks (healthz and readyz must pass)
        run: |
          for path in healthz readyz; do
            code=""
            for attempt in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -m 15 -w '%{http_code}' "$PRODUCTION_URL/$path")
              [ "$code" = "200" ] && break
              sleep 10
            done
            echo "Production /$path -> HTTP $code" | tee -a "$GITHUB_STEP_SUMMARY"
            [ "$code" = "200" ] || { echo "::error::Production /$path failed; roll back with: wrangler rollback --name vsn-builder-production"; exit 1; }
          done
