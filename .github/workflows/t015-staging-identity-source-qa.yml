name: T015 Staging Shopify Identity Source Contract (No Deploy)
on:
  pull_request:
    branches: [development]
    paths:
      - ".github/workflows/phase1-protected-identity-preflight.yml"
      - ".github/workflows/staging-hosted-readiness.yml"
      - ".github/workflows/t015-protected-staging-shopify-identity.yml"
      - ".github/workflows/t015-staging-identity-source-qa.yml"
      - "tests/t015-staging-metafields-identity.test.mjs"
permissions:
  contents: read
# Cancel superseded pull_request runs only; protected-branch pushes always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  staging-identity-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Checkout PR without token persistence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.18.0"
      - name: Require Metafields pattern and preserve Dev/Prod isolation without secrets
        run: node --test tests/t015-staging-metafields-identity.test.mjs
      - name: Confirm synthetic-only scope
        run: echo "No real secrets, Partner mutation, Worker deploy, Shopify OAuth, SQL or Production action"
