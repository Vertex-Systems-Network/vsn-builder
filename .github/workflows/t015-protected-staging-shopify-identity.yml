name: T015 Protected Staging Shopify App Identity (No Deploy)
# GitHub-scoped real secret attestation, not OAuth/Partner ownership evidence.
# Protected development only; never PR, Production or live deployment.
on:
  push:
    branches: [development]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protected-reference:
    if: github.ref == 'refs/heads/development' && github.ref_protected == true
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify protected Builder development ref before secret exposure
        shell: bash
        env:
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          test "$SOURCE_REPO" = "Vertex-Systems-Network/vsn-builder"
          test "$SOURCE_REF" = "refs/heads/development"
          test "$SOURCE_PROTECTED" = "true"
  stage-identity:
    needs: protected-reference
    environment: cloudflare-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
      SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
    steps:
      - name: Check real Staging scoped client ID and presence of Shopify secret, no checkout
        shell: bash
        run: |
          set +x
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          live = "997eae5a9961f21d131e5f31bbbe31d3"
          stage = "0ecd6b7151485b41ea65924fe827806a"
          dev = "f6156da0bd799053f2f0bd0f9e10983c"
          errors = []
          if len({live, stage, dev}) != 3:
              errors.append("T015_CROSS_TIER_CLIENT_ID_COLLISION")
          key = os.environ.get("SHOPIFY_API_KEY", "")
          if not re.fullmatch(r"[a-fA-F0-9]{32}", key) or key.lower() != stage:
              errors.append("T015_SCOPED_SHOPIFY_STAGING_CLIENT_MISMATCH")
          if not os.environ.get("SHOPIFY_API_SECRET"):
              errors.append("T015_MISSING_SCOPED_SHOPIFY_STAGING_SECRET")
          for err in errors:
              print("::error::" + err)
          if errors:
              raise SystemExit(1)
          print("T015 protected real GitHub Staging Shopify API identity: PASS.")
          print("Verified: three distinct publicly registered client IDs and scoped Staging secret presence.")
          print("NOT certified: Dev store install, Shopify Partner legal ownership, OAuth callback, merchant sessions or hosted Worker.")
          PY
